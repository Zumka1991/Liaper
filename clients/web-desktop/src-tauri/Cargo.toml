[package]
name = "liaper-desktop"
version = "0.1.0"
description = "Liaper Desktop (Windows & Linux) powered by Tauri v2 and Rust"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-updater = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
