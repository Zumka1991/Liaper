name: liaper_android
description: Liaper Mobile (Android) — защищённые групповые звонки и чат для репетиторства с E2EE и автообновлением.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  flutter_webrtc: ^1.6.2
  cryptography: ^2.7.0
  crypto: ^3.0.5
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
